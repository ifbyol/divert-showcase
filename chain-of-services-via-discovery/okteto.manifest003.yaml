deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceey
      - servicea
      - servicefy
      - servicedl
      - servicebp
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceey:
    command: bash
    sync:
      - serviceey:/usr/src/app
  servicea:
    command: bash
    sync:
      - servicea:/usr/src/app
  servicefy:
    command: bash
    sync:
      - servicefy:/usr/src/app
  servicedl:
    command: bash
    sync:
      - servicedl:/usr/src/app
  servicebp:
    command: bash
    sync:
      - servicebp:/usr/src/app
