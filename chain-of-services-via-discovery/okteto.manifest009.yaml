deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceek
      - servicefu
      - servicecy
      - serviceb
      - servicebp
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceek:
    command: bash
    sync:
      - serviceek:/usr/src/app
  servicefu:
    command: bash
    sync:
      - servicefu:/usr/src/app
  servicecy:
    command: bash
    sync:
      - servicecy:/usr/src/app
  serviceb:
    command: bash
    sync:
      - serviceb:/usr/src/app
  servicebp:
    command: bash
    sync:
      - servicebp:/usr/src/app
