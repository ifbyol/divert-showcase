deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceal
      - servicecm
      - servicefy
      - serviceeu
      - servicecp
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceal:
    command: bash
    sync:
      - serviceal:/usr/src/app
  servicecm:
    command: bash
    sync:
      - servicecm:/usr/src/app
  servicefy:
    command: bash
    sync:
      - servicefy:/usr/src/app
  serviceeu:
    command: bash
    sync:
      - serviceeu:/usr/src/app
  servicecp:
    command: bash
    sync:
      - servicecp:/usr/src/app
