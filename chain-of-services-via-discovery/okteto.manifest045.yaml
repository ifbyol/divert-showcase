deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceck
      - servicege
      - servicefy
      - servicefx
      - serviceej
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceck:
    command: bash
    sync:
      - serviceck:/usr/src/app
  servicege:
    command: bash
    sync:
      - servicege:/usr/src/app
  servicefy:
    command: bash
    sync:
      - servicefy:/usr/src/app
  servicefx:
    command: bash
    sync:
      - servicefx:/usr/src/app
  serviceej:
    command: bash
    sync:
      - serviceej:/usr/src/app
