deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicedm
      - servicebu
      - serviceco
      - servicebs
      - servicegh
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicedm:
    command: bash
    sync:
      - servicedm:/usr/src/app
  servicebu:
    command: bash
    sync:
      - servicebu:/usr/src/app
  serviceco:
    command: bash
    sync:
      - serviceco:/usr/src/app
  servicebs:
    command: bash
    sync:
      - servicebs:/usr/src/app
  servicegh:
    command: bash
    sync:
      - servicegh:/usr/src/app
