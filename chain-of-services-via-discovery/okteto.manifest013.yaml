deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicefr
      - serviceag
      - serviceej
      - servicego
      - serviceea
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicefr:
    command: bash
    sync:
      - servicefr:/usr/src/app
  serviceag:
    command: bash
    sync:
      - serviceag:/usr/src/app
  serviceej:
    command: bash
    sync:
      - serviceej:/usr/src/app
  servicego:
    command: bash
    sync:
      - servicego:/usr/src/app
  serviceea:
    command: bash
    sync:
      - serviceea:/usr/src/app
