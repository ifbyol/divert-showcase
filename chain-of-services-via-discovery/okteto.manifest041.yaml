deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicega
      - serviceak
      - servicecw
      - servicecn
      - servicecv
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicega:
    command: bash
    sync:
      - servicega:/usr/src/app
  serviceak:
    command: bash
    sync:
      - serviceak:/usr/src/app
  servicecw:
    command: bash
    sync:
      - servicecw:/usr/src/app
  servicecn:
    command: bash
    sync:
      - servicecn:/usr/src/app
  servicecv:
    command: bash
    sync:
      - servicecv:/usr/src/app
