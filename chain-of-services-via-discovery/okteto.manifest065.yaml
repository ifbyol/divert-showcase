deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceo
      - servicefb
      - serviceby
      - serviceek
      - servicecy
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceo:
    command: bash
    sync:
      - serviceo:/usr/src/app
  servicefb:
    command: bash
    sync:
      - servicefb:/usr/src/app
  serviceby:
    command: bash
    sync:
      - serviceby:/usr/src/app
  serviceek:
    command: bash
    sync:
      - serviceek:/usr/src/app
  servicecy:
    command: bash
    sync:
      - servicecy:/usr/src/app
