deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicegi
      - serviceet
      - servicegp
      - serviceaa
      - servicecs
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicegi:
    command: bash
    sync:
      - servicegi:/usr/src/app
  serviceet:
    command: bash
    sync:
      - serviceet:/usr/src/app
  servicegp:
    command: bash
    sync:
      - servicegp:/usr/src/app
  serviceaa:
    command: bash
    sync:
      - serviceaa:/usr/src/app
  servicecs:
    command: bash
    sync:
      - servicecs:/usr/src/app
