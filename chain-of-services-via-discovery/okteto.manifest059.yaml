deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicefs
      - servicedl
      - serviceag
      - serviceco
      - serviceb
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicefs:
    command: bash
    sync:
      - servicefs:/usr/src/app
  servicedl:
    command: bash
    sync:
      - servicedl:/usr/src/app
  serviceag:
    command: bash
    sync:
      - serviceag:/usr/src/app
  serviceco:
    command: bash
    sync:
      - serviceco:/usr/src/app
  serviceb:
    command: bash
    sync:
      - serviceb:/usr/src/app
