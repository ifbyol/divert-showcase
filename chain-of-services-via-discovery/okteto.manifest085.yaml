deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceaj
      - servicebs
      - servicecp
      - servicedu
      - serviceec
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceaj:
    command: bash
    sync:
      - serviceaj:/usr/src/app
  servicebs:
    command: bash
    sync:
      - servicebs:/usr/src/app
  servicecp:
    command: bash
    sync:
      - servicecp:/usr/src/app
  servicedu:
    command: bash
    sync:
      - servicedu:/usr/src/app
  serviceec:
    command: bash
    sync:
      - serviceec:/usr/src/app
