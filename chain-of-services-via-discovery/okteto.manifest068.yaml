deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceai
      - servicefg
      - serviceeu
      - servicefi
      - servicecq
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceai:
    command: bash
    sync:
      - serviceai:/usr/src/app
  servicefg:
    command: bash
    sync:
      - servicefg:/usr/src/app
  serviceeu:
    command: bash
    sync:
      - serviceeu:/usr/src/app
  servicefi:
    command: bash
    sync:
      - servicefi:/usr/src/app
  servicecq:
    command: bash
    sync:
      - servicecq:/usr/src/app
