deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicege
      - servicefq
      - servicecv
      - serviceg
      - servicew
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicege:
    command: bash
    sync:
      - servicege:/usr/src/app
  servicefq:
    command: bash
    sync:
      - servicefq:/usr/src/app
  servicecv:
    command: bash
    sync:
      - servicecv:/usr/src/app
  serviceg:
    command: bash
    sync:
      - serviceg:/usr/src/app
  servicew:
    command: bash
    sync:
      - servicew:/usr/src/app
