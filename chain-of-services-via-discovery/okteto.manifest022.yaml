deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicean
      - serviceby
      - servicebf
      - servicebo
      - serviceex
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicean:
    command: bash
    sync:
      - servicean:/usr/src/app
  serviceby:
    command: bash
    sync:
      - serviceby:/usr/src/app
  servicebf:
    command: bash
    sync:
      - servicebf:/usr/src/app
  servicebo:
    command: bash
    sync:
      - servicebo:/usr/src/app
  serviceex:
    command: bash
    sync:
      - serviceex:/usr/src/app
