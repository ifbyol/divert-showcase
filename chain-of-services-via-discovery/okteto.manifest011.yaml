deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicean
      - servicebq
      - servicebc
      - servicebn
      - serviceeu
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicean:
    command: bash
    sync:
      - servicean:/usr/src/app
  servicebq:
    command: bash
    sync:
      - servicebq:/usr/src/app
  servicebc:
    command: bash
    sync:
      - servicebc:/usr/src/app
  servicebn:
    command: bash
    sync:
      - servicebn:/usr/src/app
  serviceeu:
    command: bash
    sync:
      - serviceeu:/usr/src/app
