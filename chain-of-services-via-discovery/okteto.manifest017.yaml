deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicer
      - servicefo
      - servicedi
      - servicegf
      - serviceeh
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicer:
    command: bash
    sync:
      - servicer:/usr/src/app
  servicefo:
    command: bash
    sync:
      - servicefo:/usr/src/app
  servicedi:
    command: bash
    sync:
      - servicedi:/usr/src/app
  servicegf:
    command: bash
    sync:
      - servicegf:/usr/src/app
  serviceeh:
    command: bash
    sync:
      - serviceeh:/usr/src/app
