deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicegf
      - servicedp
      - serviceck
      - servicecl
      - servicep
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicegf:
    command: bash
    sync:
      - servicegf:/usr/src/app
  servicedp:
    command: bash
    sync:
      - servicedp:/usr/src/app
  serviceck:
    command: bash
    sync:
      - serviceck:/usr/src/app
  servicecl:
    command: bash
    sync:
      - servicecl:/usr/src/app
  servicep:
    command: bash
    sync:
      - servicep:/usr/src/app
