deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicebo
      - serviceav
      - serviceck
      - servicedd
      - servicedy
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicebo:
    command: bash
    sync:
      - servicebo:/usr/src/app
  serviceav:
    command: bash
    sync:
      - serviceav:/usr/src/app
  serviceck:
    command: bash
    sync:
      - serviceck:/usr/src/app
  servicedd:
    command: bash
    sync:
      - servicedd:/usr/src/app
  servicedy:
    command: bash
    sync:
      - servicedy:/usr/src/app
