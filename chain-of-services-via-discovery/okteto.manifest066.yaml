deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceag
      - servicecm
      - serviced
      - servicegf
      - servicebp
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceag:
    command: bash
    sync:
      - serviceag:/usr/src/app
  servicecm:
    command: bash
    sync:
      - servicecm:/usr/src/app
  serviced:
    command: bash
    sync:
      - serviced:/usr/src/app
  servicegf:
    command: bash
    sync:
      - servicegf:/usr/src/app
  servicebp:
    command: bash
    sync:
      - servicebp:/usr/src/app
