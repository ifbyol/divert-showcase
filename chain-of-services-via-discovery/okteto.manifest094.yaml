deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceeg
      - serviceah
      - serviceae
      - servicefs
      - serviceag
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceeg:
    command: bash
    sync:
      - serviceeg:/usr/src/app
  serviceah:
    command: bash
    sync:
      - serviceah:/usr/src/app
  serviceae:
    command: bash
    sync:
      - serviceae:/usr/src/app
  servicefs:
    command: bash
    sync:
      - servicefs:/usr/src/app
  serviceag:
    command: bash
    sync:
      - serviceag:/usr/src/app
