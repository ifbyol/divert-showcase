deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceej
      - servicedg
      - servicebo
      - serviceer
      - servicefp
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceej:
    command: bash
    sync:
      - serviceej:/usr/src/app
  servicedg:
    command: bash
    sync:
      - servicedg:/usr/src/app
  servicebo:
    command: bash
    sync:
      - servicebo:/usr/src/app
  serviceer:
    command: bash
    sync:
      - serviceer:/usr/src/app
  servicefp:
    command: bash
    sync:
      - servicefp:/usr/src/app
