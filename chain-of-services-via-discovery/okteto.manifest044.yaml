deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceh
      - servicedk
      - serviceaf
      - servicew
      - servicecx
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceh:
    command: bash
    sync:
      - serviceh:/usr/src/app
  servicedk:
    command: bash
    sync:
      - servicedk:/usr/src/app
  serviceaf:
    command: bash
    sync:
      - serviceaf:/usr/src/app
  servicew:
    command: bash
    sync:
      - servicew:/usr/src/app
  servicecx:
    command: bash
    sync:
      - servicecx:/usr/src/app
