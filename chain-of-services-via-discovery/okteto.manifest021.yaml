deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicefl
      - serviceas
      - serviceao
      - serviceci
      - servicegk
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicefl:
    command: bash
    sync:
      - servicefl:/usr/src/app
  serviceas:
    command: bash
    sync:
      - serviceas:/usr/src/app
  serviceao:
    command: bash
    sync:
      - serviceao:/usr/src/app
  serviceci:
    command: bash
    sync:
      - serviceci:/usr/src/app
  servicegk:
    command: bash
    sync:
      - servicegk:/usr/src/app
