deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicegj
      - serviceej
      - servicect
      - servicet
      - servicefu
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicegj:
    command: bash
    sync:
      - servicegj:/usr/src/app
  serviceej:
    command: bash
    sync:
      - serviceej:/usr/src/app
  servicect:
    command: bash
    sync:
      - servicect:/usr/src/app
  servicet:
    command: bash
    sync:
      - servicet:/usr/src/app
  servicefu:
    command: bash
    sync:
      - servicefu:/usr/src/app
