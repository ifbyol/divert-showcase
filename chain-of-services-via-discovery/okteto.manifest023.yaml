deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicear
      - servicefc
      - serviced
      - servicefg
      - serviceer
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicear:
    command: bash
    sync:
      - servicear:/usr/src/app
  servicefc:
    command: bash
    sync:
      - servicefc:/usr/src/app
  serviced:
    command: bash
    sync:
      - serviced:/usr/src/app
  servicefg:
    command: bash
    sync:
      - servicefg:/usr/src/app
  serviceer:
    command: bash
    sync:
      - serviceer:/usr/src/app
