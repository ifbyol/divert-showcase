deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicegg
      - servicebx
      - servicecl
      - serviceab
      - servicefl
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicegg:
    command: bash
    sync:
      - servicegg:/usr/src/app
  servicebx:
    command: bash
    sync:
      - servicebx:/usr/src/app
  servicecl:
    command: bash
    sync:
      - servicecl:/usr/src/app
  serviceab:
    command: bash
    sync:
      - serviceab:/usr/src/app
  servicefl:
    command: bash
    sync:
      - servicefl:/usr/src/app
