deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicegq
      - servicebk
      - serviceau
      - servicecz
      - servicecw
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicegq:
    command: bash
    sync:
      - servicegq:/usr/src/app
  servicebk:
    command: bash
    sync:
      - servicebk:/usr/src/app
  serviceau:
    command: bash
    sync:
      - serviceau:/usr/src/app
  servicecz:
    command: bash
    sync:
      - servicecz:/usr/src/app
  servicecw:
    command: bash
    sync:
      - servicecw:/usr/src/app
