deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceco
      - serviceda
      - servicedl
      - servicedx
      - servicegf
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceco:
    command: bash
    sync:
      - serviceco:/usr/src/app
  serviceda:
    command: bash
    sync:
      - serviceda:/usr/src/app
  servicedl:
    command: bash
    sync:
      - servicedl:/usr/src/app
  servicedx:
    command: bash
    sync:
      - servicedx:/usr/src/app
  servicegf:
    command: bash
    sync:
      - servicegf:/usr/src/app
