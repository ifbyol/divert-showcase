deploy:
  compose:
    file: docker-compose.yaml
    services:
      - servicedx
      - servicegf
      - servicecr
      - serviceh
      - serviceal
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  servicedx:
    command: bash
    sync:
      - servicedx:/usr/src/app
  servicegf:
    command: bash
    sync:
      - servicegf:/usr/src/app
  servicecr:
    command: bash
    sync:
      - servicecr:/usr/src/app
  serviceh:
    command: bash
    sync:
      - serviceh:/usr/src/app
  serviceal:
    command: bash
    sync:
      - serviceal:/usr/src/app
