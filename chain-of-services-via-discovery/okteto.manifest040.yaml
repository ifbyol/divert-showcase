deploy:
  compose:
    file: docker-compose.yaml
    services:
      - serviceau
      - servicebu
      - servicebp
      - serviceel
      - servicech
  divert:
    namespace: $SHARED_NAMESPACE
dev:
  serviceau:
    command: bash
    sync:
      - serviceau:/usr/src/app
  servicebu:
    command: bash
    sync:
      - servicebu:/usr/src/app
  servicebp:
    command: bash
    sync:
      - servicebp:/usr/src/app
  serviceel:
    command: bash
    sync:
      - serviceel:/usr/src/app
  servicech:
    command: bash
    sync:
      - servicech:/usr/src/app
